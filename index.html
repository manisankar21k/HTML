<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Learning Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #667eea; min-height: 100vh; color: #333; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 2rem; padding: 1rem; }
        .header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .section { background: white; margin: 1rem 0; border-radius: 10px; overflow: hidden; }
        .section-title { background: #f8f9fa; padding: 1rem; color: #667eea; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .section-title::after { content: "▼"; font-size: 0.8rem; transition: transform 0.3s; }
        input[type="checkbox"]:checked + .section-title::after { transform: rotate(180deg); }
        .section-content { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; padding: 1rem; }
        #assignments-content, #css-assignments-content, #js-assignments-content { display: none; }
        #assignments-toggle:checked ~ #assignments-content, 
        #css-assignments-toggle:checked ~ #css-assignments-content,
        #js-assignments-toggle:checked ~ #js-assignments-content { display: grid; }
        input[type="checkbox"] { display: none; }
        .nav-card { background: #f8f9fa; padding: 1rem; border-radius: 8px; text-decoration: none; color: #333; text-align: center; transition: all 0.3s ease; }
        .nav-card:hover { background: #667eea; color: white; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .footer { text-align: center; color: white; margin-top: 2rem; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>HTML Learning Portal</h1>
            <p>Click sections to explore content</p>
        </header>

        <div class="section">
            <input type="checkbox" id="assignments-toggle" checked>
            <label for="assignments-toggle" class="section-title"> HTML Assignments (1-3)</label>
            <div class="section-content" id="assignments-content">
                <a href="HTML/assignment/assignment1/assignment.html" class="nav-card">Assignment 1</a>
                <a href="HTML/assignment/assignment2/assigment2.html" class="nav-card">Assignment 2</a>
                <a href="HTML/assignment/assignment 3/htmlproject.html" class="nav-card">Assignment 3</a>
            </div>
        </div>

        <div class="section">
            <input type="checkbox" id="css-assignments-toggle">
            <label for="css-assignments-toggle" class="section-title"> CSS Assignments</label>
            <div class="section-content" id="css-assignments-content">
                <a href="CSS/assignment/4 box creating/boxmodel.html" class="nav-card">4box</a>
                <a href="CSS/assignment/4 box , 4 pic/assignment.html" class="nav-card">4box 4 pic</a>
                <a href="CSS/assignment/banner/banner.html" class="nav-card">banner</a>
                <a href="CSS/assignment/dashboard/dashboard.html" class="nav-card">dashboard</a>
                <a href="CSS/htmlcss/htmlcssbook.html" class="nav-card">htmlcss ebook</a>
                <a href="CSS/assignment/media querry/mediaquerry.html" class="nav-card">Responsive Design</a>
                <a href="CSS/assignment/annimation/animation.html" class="nav-card">CSS Animations</a>
            </div>
        </div>

        <div class="section">
            <input type="checkbox" id="js-assignments-toggle">
            <label for="js-assignments-toggle" class="section-title"> JavaScript Assignments</label>
            <div class="section-content" id="js-assignments-content">
                <a href="javascript/assignment/24times/24timesvar.html" class="nav-card">var declaration </a>
                <a href="javascript/assignment/24times/24timeslet.html" class="nav-card">let declaration</a>
                <a href="javascript/assignment/24times/numbers.html" class="nav-card">numbers initialiation</a>
                <a href="javascript/assignment/24times/24timesconst.html" class="nav-card">initialization</a>
            </div>
        </div>

        <footer class="footer">
            <p>© 2025 HTML Learning Portal</p>
        </footer>
    </div>
</body>
</html>
